*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}

.logo{display:flex;align-items:baseline;gap:9px}
.logo .mark{font-family:'Lora',serif;font-weight:600;font-size:21px;color:var(--pri);letter-spacing:.04em}
.logo .sub{font-size:9.5px;text-transform:uppercase;letter-spacing:.2em;color:var(--dim)}
.spacer{flex:1}
.bell{position:relative;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--panel);font-size:13px;color:var(--ink)}
.bell .bcount{position:absolute;top:-7px;right:-7px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;font-weight:600;padding:1px 6px}
.userpill{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--pri-bg);color:var(--pri-dark);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.wrap{display:flex;min-height:calc(100vh - 53px)}
nav.side{width:238px;background:var(--paper);border-right:1px solid var(--line);padding:12px 0;flex-shrink:0}
.side-block{padding:6px 14px 10px}
.side-lab{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:8px 4px 6px}
.co-select{width:100%;font-size:12px}
.role-v{display:flex;flex-direction:column;gap:5px}
.role-chip{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--dim);font-family:'Sora';font-size:12px;cursor:pointer;transition:.15s;text-align:left;position:relative}
.role-chip:hover{border-color:var(--pri);color:var(--pri)}

.role-chip.active .rb{background:#fff;color:var(--pri-dark)}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;color:var(--dim);font-size:13px;border-left:3px solid transparent;transition:.15s}
.nav-item:hover{color:var(--strong);background:var(--panel)}
.nav-item.active{color:var(--pri-dark);border-left-color:var(--pri);background:var(--pri-bg)}
.nav-item .ic{width:18px;text-align:center;font-size:13px}
.nav-item .nb{margin-left:auto;background:var(--warn-bg);color:var(--warn);border-radius:99px;font-size:10px;font-weight:600;padding:1px 7px}
main{flex:1;padding:22px 28px;max-width:1230px}
.mod{animation:fade .25s}

.mhead h2{font-size:23px;margin-top:3px}

.grid{display:grid;gap:13px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 1px 4px rgba(34,50,58,.04)}

.card.click{cursor:pointer;transition:.15s}
.card.click:hover{border-color:var(--pri);box-shadow:0 3px 10px rgba(67,128,140,.13);transform:translateY(-1px)}
.kpi .v{font-family:'Lora';font-weight:600;font-size:26px;color:var(--pri-dark)}
.kpi .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;margin-top:2px}
.kpi .go{font-size:10.5px;color:var(--pri);margin-top:5px}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:600}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)}

table{width:100%;border-collapse:collapse;font-size:12.8px}
th{font-size:10.3px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
td{padding:7.5px 9px;border-bottom:1px solid var(--line2)}
tr:hover td{background:var(--panel)}
tr.click{cursor:pointer}
button.btn{background:var(--pri);color:#fff;border:none;border-radius:8px;padding:9px 15px;font-family:'Sora';font-weight:600;font-size:12.3px;cursor:pointer;transition:.15s}

input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--strong);padding:8px 10px;font-family:'Sora';font-size:13px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
input.num{width:90px;text-align:center;font-weight:600}

.bar{height:7px;background:var(--line2);border-radius:99px;overflow:hidden;margin-top:5px}

.notice.soft{border-color:var(--ok);background:var(--ok-bg)}

.q{padding:12px 0;border-bottom:1px solid var(--line2)}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{flex:1;min-width:82px;padding:10px 7px;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;cursor:pointer;text-align:center;transition:.15s}

.chip.sel{border-color:var(--pri);background:var(--pri-bg)}

.tabs{display:flex;gap:3px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}

.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}

.flow{display:flex;gap:0;overflow-x:auto;margin:8px 0 4px}
.fstep{flex:1;min-width:105px;text-align:center;position:relative;padding:0 4px}
.fstep .fdot{width:26px;height:26px;border-radius:50%;background:var(--paper);border:2px solid var(--line);color:var(--dim);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin:0 auto 5px;position:relative;z-index:2}
.fstep::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line);z-index:1}
.fstep:first-child::before{display:none}
.fstep .fl{font-size:10.3px;color:var(--dim);line-height:1.3}
.fstep.done .fdot{background:var(--ok);border-color:var(--ok);color:#fff}
.fstep.done .fl{color:var(--ok)}
.fstep.now .fdot{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 0 0 4px var(--pri-bg)}
.fstep.now .fl{color:var(--pri-dark);font-weight:600}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(34,50,58,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px 16px;overflow-y:auto}
.modal-bg.on{display:flex}
.modal{background:var(--paper);border-radius:14px;max-width:760px;width:100%;padding:26px 30px;box-shadow:0 12px 40px rgba(34,50,58,.25)}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .msub{font-size:11px;color:var(--dim);margin-bottom:14px}
.doctext{white-space:pre-wrap;font-size:12.6px;line-height:1.7;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;max-height:56vh;overflow-y:auto}

.scorebox .sv{font-family:'Lora';font-size:30px;font-weight:600;color:var(--pri-dark)}
.sig{border:1.5px dashed var(--pri-soft);border-radius:10px;padding:14px;background:var(--panel)}
@media(max-width:960px){.g2,.g3,.g4{grid-template-columns:1fr}nav.side{width:70px}.side-block{display:none}.nav-item span.t{display:none}main{padding:14px}}

function spark(vals,wd=260,ht=52){
 const v=vals.filter(x=>x!=null); if(v.length<2) return '<span class="mini">histórico insuficiente</span>';
 const min=Math.min(...v)-.3,max=Math.max(...v)+.3;
 const pts=vals.map((x,i)=>x==null?null:[(i/(vals.length-1))*(wd-16)+8,ht-8-((x-min)/(max-min))*(ht-16)]).filter(p=>p);
 const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
 return '<svg class="spark" viewBox="0 0 '+wd+' '+ht+'"><path d="'+path+'" fill="none" stroke="#43808C" stroke-width="2.5" stroke-linecap="round"/>'+pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.2" fill="#fff" stroke="#43808C" stroke-width="2"/>').join('')+'</svg>';
}

/* ---------- CÁLCULO DA NOTA ---------- */
function calcScore(f){
 const objList=co().objs;
 let objPct=0,objAns=0;
 objList.forEach((o,i)=>{if(f['o'+i]!=null&&f['o'+i]!==''){objPct+=o[1]*Math.min(+f['o'+i],120)/100;objAns++}});
 const objScore=objAns?Math.min(5,(objPct/100)*5):null;
 const compVals=COMPS.map((_,i)=>f['c'+i]).filter(x=>x!=null);
 const compScore=compVals.length?avgArr(compVals):null;
 const valVals=VALS.map((_,i)=>f['v'+i]).filter(x=>x!=null).map(x=>x==='sim'?5:2.5);
 const valScore=valVals.length?avgArr(valVals):null;
 let final=null;
 if(objScore!=null&&compScore!=null&&valScore!=null&&objAns===objList.length&&compVals.length===COMPS.length&&valVals.length===VALS.length){
  final=Math.round((objScore*PESOS.obj/100+compScore*PESOS.comp/100+valScore*PESOS.val/100)*10)/10;
 }
 return {objScore,compScore,valScore,final,
  done:objAns+compVals.length+valVals.length, total:objList.length+COMPS.length+VALS.length};
}

'REGULAMENTO DE AVALIAÇÃO DE DESEMPENHO — CICLO 2026\n\nArtigo 1.º (Objecto) — Define o sistema de avaliação de desempenho, com fins de desenvolvimento, reconhecimento e gestão.\n\nArtigo 3.º (Escala) — A escala é de 1 a 5: Insuficiente (<2,5), Suficiente (2,5–2,9), Bom (3,0–3,9), Muito Bom (4,0–4,4), Excelente (≥4,5).\n\nArtigo 4.º (Componentes e ponderações) — A nota final resulta de: Objectivos (50%), Competências (35%) e Valores e Conduta (15%). Para dirigentes: 60/25/15.\n\nArtigo 5.º (Fluxo) — O ciclo compreende: contratualização de objectivos; acompanhamento com check-ins; autoavaliação; avaliação pela chefia; conferência e concordância do avaliado; recurso (quando haja discordância); validação pelo órgão de administração; relatório.\n\nArtigo 7.º (Concordância e recurso) — Notificado da avaliação da chefia, o trabalhador pode: a) aceitar, encerrando-se a avaliação; b) recorrer, por escrito e fundamentadamente, no prazo de 5 dias úteis, para a Comissão de Avaliação.\n\nArtigo 8.º (Comissão de Avaliação) — Composta por 3 membros sem relação hierárquica directa com o recorrente, decide no prazo de 8 dias úteis, podendo manter ou ajustar a nota, com fundamentação notificada ao trabalhador e à chefia.\n\nArtigo 9.º (Efeitos) — As notas validadas relevam para prémios, progressões, promoções e planos de desenvolvimento, nos termos da Política de Remuneração.\n\nArtigo 10.º (Garantias) — Todo o processo fica registado com carimbo temporal; o trabalhador tem acesso permanente ao seu processo pelo portal.'},
 termos:{t:'Termos de Utilização do Portal e Consentimento de Dados', s:'Lei n.º 22/11, de 17 de Junho', x:
'TERMOS DE UTILIZAÇÃO DO PORTAL DO COLABORADOR E TRATAMENTO DE DADOS PESSOAIS\n\n1. O portal do colaborador é o canal oficial de comunicação entre a empresa e o trabalhador para efeitos de gestão da relação laboral: documentos do vínculo, políticas internas, avaliação de desempenho, notificações — incluindo as de natureza disciplinar — e registos de saúde ocupacional (limitados à aptidão).\n\n2. Responsável pelo tratamento: '+c.nome+'. Subcontratante tecnológico: CLACS TECNOLOGIA (plataforma KAMBA), com dados alojados em território nacional.\n\n3. Finalidades: execução do contrato de trabalho, cumprimento de obrigações legais, gestão e avaliação de desempenho, formação, segurança e saúde no trabalho.\n\n4. Direitos do titular (Lei n.º 22/11): acesso, rectificação, actualização e, nos termos legais, oposição e eliminação. Pedidos através do Capital Humano.\n\n5. Conservação: pelo período do vínculo e prazos legais subsequentes.\n\n6. As notificações efectuadas pelo portal, com registo de recepção e leitura, valem como comunicação escrita ao trabalhador para todos os efeitos internos.\n\nAo assinar digitalmente, o trabalhador declara ter lido e compreendido estes termos, o Regulamento Interno, o Código de Ética e as políticas em vigor, e consente no tratamento dos seus dados para as finalidades indicadas.'},
 remuneracao:{t:'Política de Remuneração e Benefícios (excerto)', s:'Ver. 3', x:
'POLÍTICA DE REMUNERAÇÃO E BENEFÍCIOS — EXCERTO\n\n1. A remuneração compõe-se de: vencimento base (tabela salarial por grupo e escalão), subsídio de alimentação, subsídio de transporte e, quando aplicável, subsídios de função ou de turno.\n\n2. Prémio de desempenho — atribuído anualmente em função da nota validada do ciclo: Excelente: até 1,5 vencimentos; Muito Bom: até 1; Bom: até 0,5. Sem prémio abaixo de Bom.\n\n3. Progressão — a progressão de escalão pondera as notas dos últimos 2 ciclos; a promoção de categoria exige nota mínima de Muito Bom no último ciclo e parecer do comité de talento.\n\n4. Transparência — cada colaborador consulta no portal o seu enquadramento e a sua progressão salarial histórica.'},
 notaculpa:{t:'Convocatória / Nota de Culpa — '+c.disc.ref, s:'Notificada pelo portal · registo de leitura', x:
'PROCESSO DISCIPLINAR '+c.disc.ref+'\nNOTA DE CULPA E CONVOCATÓRIA\n\nAo trabalhador: '+emps().find(x=>x.id===c.disc.arg).nome+' ('+emps().find(x=>x.id===c.disc.arg).cargo+')\n\nNos termos da Lei Geral do Trabalho (Lei n.º 12/23) e do artigo 17.º do Regulamento Interno, comunica-se a instauração de processo disciplinar com base nos seguintes factos:\n\n'+c.disc.factos+'\n\n'+c.disc.hist+'\n\nOs factos descritos são susceptíveis de constituir infracção disciplinar aos deveres previstos no artigo 12.º do Regulamento Interno.\n\nFica V. Exa. notificado para, no prazo de 10 dias úteis, apresentar por escrito a sua defesa, requerer diligências e indicar testemunhas (máx. 3 por facto), podendo consultar o processo integral neste portal.\n\nA presente notificação considera-se efectuada com o registo de leitura no portal do colaborador.\n\nO Instrutor do Processo\n(Gabinete Jurídico / Capital Humano)'},
 suspensao:{t:'Comunicação de Suspensão Preventiva — '+c.disc.ref, s:'Sem perda de remuneração', x:
'PROCESSO DISCIPLINAR '+c.disc.ref+'\nCOMUNICAÇÃO DE SUSPENSÃO PREVENTIVA\n\nConsiderando a natureza dos factos em averiguação e a inconveniência da presença do trabalhador no local de trabalho durante a instrução, determina-se, nos termos da Lei Geral do Trabalho, a SUSPENSÃO PREVENTIVA do trabalhador '+emps().find(x=>x.id===c.disc.arg).nome+', SEM PERDA DE REMUNERAÇÃO, com efeitos imediatos e até à conclusão do processo.\n\nA suspensão preventiva não constitui sanção nem juízo antecipado sobre a responsabilidade do trabalhador.\n\nNotificada pelo portal do colaborador, com registo de leitura.'},
 decisao:{t:'Decisão Final — '+c.disc.ref, s:'Fundamentada · notificada pelo portal', x:
'PROCESSO DISCIPLINAR '+c.disc.ref+'\nDECISÃO FINAL\n\nInstruído o processo, apresentada e ponderada a defesa do trabalhador, ouvidas as testemunhas e analisada a prova documental, conclui-se pela prática de infracção disciplinar aos deveres de zelo e cumprimento das normas internas.\n\nPonderadas a gravidade dos factos, o grau de culpa, os antecedentes e as circunstâncias atenuantes apuradas, decide-se aplicar a medida disciplinar de:\n\n» '+(S.co==='ml'?'REPREENSÃO REGISTADA':'(a definir pelo instrutor no acto de decisão)')+'\n\nA medida é registada no cadastro disciplinar do trabalhador, extinguindo-se nos prazos legais mediante boa conduta.\n\nDesta decisão cabe reclamação e recurso nos termos gerais de direito.\n\nNotificada ao trabalhador pelo portal, com registo de leitura, e ao Capital Humano para execução.'}
 };
 return T[key];
}
function openDoc(key){S.viewDoc=key;const d=DOCS(key);
 $('modalBox').innerHTML='<h3>'+d.t+'</h3><div class="msub">'+co().nome+' · '+d.s+' · hash de integridade #'+Math.random().toString(16).slice(2,8)+'</div><div class="doctext">'+d.x+'</div><div style="display:flex;gap:10px;margin-top:14px"><button class="btn ghost" onclick="closeModal()">Fechar</button><button class="btn" onclick="audit(\'Leitura registada: '+d.t.replace(/'/g,'')+'\');closeModal();render()">Registar leitura</button></div>';
 $('modalBg').classList.add('on');
}
function closeModal(){$('modalBg').classList.remove('on')}
</script>
<script>
/* ================= NAVEGAÇÃO ================= */
const NAV=[
 {k:'inicio', ic:'◈', l:'Início', roles:'all'},
 {k:'portal', ic:'▣', l:'Portal do Colaborador', roles:'all'},
 {k:'colabs', ic:'☰', l:'Colaboradores', roles:['CH','CE','DIR','COM']},
 {k:'aval', ic:'✎', l:'Avaliação 2026', roles:'all', badge:()=>avalPendingFor(S.role)},
 {k:'disc', ic:'§', l:'Processos Disciplinares', roles:['CH','CE','COM']},
 {k:'ausencias', ic:'⧗', l:'Férias & Ausências', roles:'all', badge:()=>absPendingFor(S.role)},
 {k:'formacao', ic:'▸', l:'Plano de Formação', roles:['CH','CE','DIR']},
 {k:'cultura', ic:'◉', l:'Cultura', roles:'all'},
 {k:'relatorios', ic:'▤', l:'Relatórios', roles:['CH','CE','DIR','COM']},
 {k:'hist', ic:'↗', l:'Histórico (3 anos)', roles:'all'},
 {k:'admin', ic:'⚙', l:'Administração', roles:['CH','CE']}
];
function avalPendingFor(r){
 const st=w().flow.stage;
 if(r==='COL'&&(st===0||st===2))return 1;
 if(r==='DIR'&&st===1)return 1;
 if(r==='COM'&&st===3)return 1;
 if(r==='CE'&&st===4)return 1;
 return 0;
}
function renderNav(){
 let h='<div class="side-block"><div class="side-lab">Empresa (SaaS multi-cliente)</div>'+
 '<select class="co-select" onchange="setCo(this.value)">'+Object.keys(CO).map(k=>'<option value="'+k+'" '+(S.co===k?'selected':'')+'>'+CO[k].nome+'</option>').join('')+'</select>'+
 '<div class="side-lab" style="margin-top:12px">Perfil de acesso</div><div class="role-v">'+
 ROLES.map(r=>{const n=w().notifs[r.k].length;return '<button class="role-chip '+(S.role===r.k?'active':'')+'" onclick="setRole(\''+r.k+'\')">'+r.l+(n?'<span class="rb">'+n+'</span>':'')+'</button>'}).join('')+
 '</div></div><div style="border-top:1px solid var(--line);margin:6px 0"></div>';
 h+=NAV.filter(n=>n.roles==='all'||n.roles.includes(S.role)).map(n=>{
  const b=n.badge?n.badge():0;
  return '<div class="nav-item '+(S.mod===n.k?'active':'')+'" onclick="go(\''+n.k+'\')"><span class="ic">'+n.ic+'</span><span class="t">'+n.l+'</span>'+(b?'<span class="nb">'+b+'</span>':'')+'</div>'}).join('');
 $('sideNav').innerHTML=h;
 $('userPill').innerHTML='<span>'+roleObj().who()+'</span><div class="avatar">'+roleObj().who().split(' ').map(x=>x[0]).slice(0,2).join('')+'</div>';
 $('bellCount').textContent=w().notifs[S.role].length;
}
function setCo(k){S.co=k;S.mod='inicio';S.tab='ficha';S.form={};S.dform={};renderNav();render()}
function setRole(k){S.role=k;const item=NAV.find(n=>n.k===S.mod);if(item&&item.roles!=='all'&&!item.roles.includes(k))S.mod='inicio';renderNav();render()}
function go(k){S.mod=k;renderNav();render();window.scrollTo(0,0)}
function goTab(t){S.tab=t;render()}
function openEmp(id){S.selEmp=id;S.mod='portal';S.tab='ficha';renderNav();render()}
function head(eb,t,p){return '<div class="mhead"><div class="eyebrow">'+eb+'</div><h2>'+t+'</h2><p>'+p+'</p></div>'}
function kbox(v,l,mod,extra){return '<div class="card kpi click" onclick="go(\''+mod+'\')"><div class="v">'+v+'</div><div class="l">'+l+'</div><div class="go">'+(extra||'ver detalhe →')+'</div></div>'}

/* ================= FLUXO DE AVALIAÇÃO — barra visual ================= */
const FSTEPS=['Autoavaliação','Avaliação do Director','Concordância','Comissão (recurso)','Fechada','Validada CE'];
function flowBar(){
 const st=w().flow.stage; const skipCom=w().flow.aceite===true;
 return '<div class="flow">'+FSTEPS.map((f,i)=>{
  let cls=''; const idx=i;
  if(skipCom&&i===3) return '<div class="fstep"><div class="fdot" style="opacity:.35">—</div><div class="fl" style="opacity:.5">'+f+'<br>(não necessária)</div></div>';
  if(idx<st||(st>=4&&idx<st))cls='done'; if(idx===st)cls='now';
  return '<div class="fstep '+cls+'"><div class="fdot">'+(cls==='done'?'✓':i+1)+'</div><div class="fl">'+f+'</div></div>'}).join('')+'</div>';
}

/* ================= INÍCIO — dashboard dinâmico ================= */
function inicio(){
 const c=co(); const wf=w().flow;
 const nAv26=emps().filter(e=>f26(e)!=null).length + (wf.stage>=4?0:0);
 const discOpen=(w().discStage!=null&&w().discStage<5)?1:0;
 const cul=c.cult; const lastResp=Math.round(cul.resp[2]/100*cul.univ);
 const medias=[avgArr(emps().map(e=>e.s[0])),avgArr(emps().map(e=>e.s[1])),avgArr(emps().map(e=>e.s[2]))];
 let roleLine='';
 if(S.role==='COL'){const p=avalPendingFor('COL');roleLine=p?'<div class="notice">✎ <b>Tem uma acção pendente na sua avaliação 2026</b> — '+(wf.stage===0?'preencha a sua autoavaliação.':'o seu Director já o avaliou: leia e decida (aceitar ou recorrer).')+' <a style="color:var(--pri);cursor:pointer;font-weight:600" onclick="go(\'aval\')">Ir para a avaliação →</a></div>':'';}
 if(S.role==='DIR'&&wf.stage===1)roleLine='<div class="notice">🔔 <b>'+colEmp().nome+' concluiu a autoavaliação</b> — a sua avaliação está pendente. <a style="color:var(--pri);cursor:pointer;font-weight:600" onclick="go(\'aval\')">Avaliar agora →</a></div>';
 if(S.role==='COM'&&wf.stage===3)roleLine='<div class="notice alert">§ <b>Recurso recebido</b> — a Comissão dispõe de 8 dias úteis para decidir. <a style="color:var(--pri);cursor:pointer;font-weight:600" onclick="go(\'aval\')">Analisar recurso →</a></div>';
 if(S.role==='CE'&&wf.stage===4)roleLine='<div class="notice">✔ <b>Avaliação fechada aguarda validação da Administração.</b> <a style="color:var(--pri);cursor:pointer;font-weight:600" onclick="go(\'aval\')">Validar →</a></div>';
 return head(c.nome+' · '+c.sector+' · desde '+c.fund,'Painel — '+roleObj().l,
 'Cada caixa é dinâmica: toque para abrir o módulo com o detalhe completo.')+roleLine+
 '<div class="grid g4">'+
  kbox(emps().length,'Colaboradores activos','colabs')+
  kbox('3','Ciclos de avaliação concluídos (2023–2025)','hist')+
  kbox(nAv26+'/'+emps().length,'Avaliações do ciclo 2026 (fecho previsto)','aval')+
  kbox(discOpen+(S.co==='ml'?' <span class="mini">(1 arquivado)</span>':''),'Processos disciplinares em curso','disc','abrir processos →')+
 '</div><div class="grid g4" style="margin-top:13px">'+
  kbox('12','Avaliações de cultura realizadas (pulses trimestrais)','cultura')+
  kbox('+'+cul.enps[2],'eNPS último ciclo · era +'+cul.enps[0]+' em 2023','cultura')+
  kbox(cul.resp[2]+'%','Participação na cultura · '+lastResp+' de '+cul.univ+' responderam','cultura')+
  kbox(medias[2].toFixed(2),'Média homologada 2025 · 2023: '+medias[0].toFixed(2),'hist')+
 '</div><div class="grid g4" style="margin-top:13px">'+
  kbox((w().mapDone?'✓':'—'),'Mapa de férias '+new Date().getFullYear()+' (art. 209.º LGT)','ausencias')+
  kbox(w().absReq.filter(r=>r.tipo==='ferias').length,'Pedidos de férias no sistema','ausencias')+
  kbox(w().absReq.filter(r=>r.tipo==='falta').length,'Faltas justificadas registadas','ausencias')+
  kbox(w().absReq.filter(r=>r.tipo==='maternidade').length,'Licenças de maternidade (LGT)','ausencias')+
 '</div>'+
 '<div class="grid g2" style="margin-top:13px">'+
  '<div class="card click" onclick="go(\'cultura\')"><h3>Recomendações — último ciclo de cultura</h3>'+c.cult.rec.map((r,i)=>'<div style="display:flex;gap:9px;padding:6px 0;border-bottom:1px solid var(--line2)"><span class="tag pri">'+(i+1)+'</span><span style="font-size:12.6px">'+r+'</span></div>').join('')+'<div class="go mini" style="color:var(--pri);margin-top:7px">abrir módulo de cultura →</div></div>'+
  '<div class="card click" onclick="go(\'relatorios\')"><h3>Recomendações — último ciclo de desempenho (2025)</h3>'+c.recDes.map((r,i)=>'<div style="display:flex;gap:9px;padding:6px 0;border-bottom:1px solid var(--line2)"><span class="tag gold">'+(i+1)+'</span><span style="font-size:12.6px">'+r+'</span></div>').join('')+'<div class="go mini" style="color:var(--pri);margin-top:7px">abrir relatórios →</div></div>'+
 '</div>'+
 '<div class="card" style="margin-top:13px"><h3>Fluxo da avaliação 2026 — caso demonstrativo ('+colEmp().nome+')</h3>'+flowBar()+
 '<div class="mini" style="margin-top:6px">O fluxo é vivo: cada submissão muda o estado e notifica o perfil seguinte. Experimente percorrê-lo mudando de perfil na barra lateral.</div></div>';
}

/* ================= PORTAL DO COLABORADOR ================= */
function portal(){
 const isCol=S.role==='COL';
 const e=isCol?colEmp():(emps().find(x=>x.id===S.selEmp)||colEmp());
 const tabs=[['ficha','Ficha'],['bemvindo','Boas-vindas & Assinaturas'],['percurso','Percurso'],['docs','Documentos'],['aval','Minhas Avaliações'],['disc','Disciplina & Notificações'],['saude','Saúde Ocupacional'],['remun','Remuneração & Assiduidade'],['politicas','Políticas']];
 let b=''; const T=S.tab; const wf=w().flow;
 if(T==='ficha') b='<div class="card"><div class="hcard"><div class="bigav">'+e.nome.split(' ').map(n=>n[0]).slice(0,2).join('')+'</div>'+
  '<div style="flex:1"><h3 style="margin:0">'+e.nome+'</h3><div class="mini">'+e.cargo+' · '+e.dept+' ('+co().dirs[e.dept]+') · '+e.cat+'</div>'+
  '<div style="margin-top:6px">'+(e.flag?'<span class="tag gold">'+e.flag+'</span> ':'')+'<span class="tag ok">Activo</span> '+(w().onboard.signed?'<span class="tag pri">políticas assinadas</span>':'<span class="tag warn">assinatura de políticas pendente</span>')+'</div></div>'+
  '<div style="text-align:right"><div class="pill-score" style="font-size:22px">'+(e.s[2]??'—')+'</div><div class="mini">avaliação 2025</div></div></div></div>'+
  '<div class="grid g2" style="margin-top:12px"><div class="card"><h3>Identificação e vínculo</h3><table>'+
  '<tr><td class="mini">N.º de colaborador</td><td>'+co().curto+'-'+String(e.id).padStart(4,'0')+'</td></tr>'+
  '<tr><td class="mini">Admissão</td><td>'+e.adm+'</td></tr>'+
  '<tr><td class="mini">Vínculo</td><td>Contrato por tempo indeterminado — <a style="color:var(--pri);cursor:pointer;font-weight:600" onclick="openDoc(\'contrato\')">ver contrato integral</a></td></tr>'+
  '<tr><td class="mini">Horário</td><td>2.ª a 6.ª · 08h00–16h30 (tolerância 15 min)</td></tr>'+
  '<tr><td class="mini">Local</td><td>'+co().sede+'</td></tr></table></div>'+
  '<div class="card"><h3>Evolução do desempenho</h3>'+spark(e.s)+
  '<table><tr><th>Ciclo</th><th>Nota</th><th>Nível</th></tr>'+[0,1,2].map(y=>'<tr><td>'+(2023+y)+'</td><td>'+(e.s[y]??'—')+'</td><td>'+(e.s[y]?'<span class="tag '+nivTag(e.s[y])+'">'+nivel(e.s[y])+'</span>':'<span class="mini">'+(e.flag&&e.flag.indexOf('licença')>-1?'ciclo ajustado':'—')+'</span>')+'</td></tr>').join('')+'</table></div></div>';
 if(T==='bemvindo'){
  const ob=w().onboard; const checks=['Li o Regulamento Interno de Trabalho','Li o Código de Ética e Conduta e as políticas em vigor','Li e consinto nos Termos de Utilização do Portal e no tratamento de dados pessoais (Lei n.º 22/11)'];
  b='<div class="grid g2"><div class="card"><h3>Bem-vindo(a) à '+co().curto+' — o seu primeiro dia</h3>'+
  '<div class="mini" style="margin-bottom:8px">Lista de acolhimento — o que deve receber e concluir:</div><table>'+
  [['Crachá e credenciais de acesso','ok','entregue'],['Conta de correio electrónico corporativo','ok','criada'],['Equipamento de trabalho / EPI da função','ok','entregue'],['Apresentação à equipa e visita às instalações','ok','concluída'],['Formação de acolhimento (ética, segurança, portal)','warn','agendada'],['Leitura e assinatura das políticas (ao lado)',ob.signed?'ok':'warn',ob.signed?'concluída':'pendente']].map(r=>'<tr><td>'+r[0]+'</td><td style="text-align:right"><span class="tag '+r[1]+'">'+r[2]+'</span></td></tr>').join('')+'</table></div>'+
  '<div class="card"><h3>Aceitação das regras e consentimento de dados</h3>'+
  (ob.signed?'<div class="notice soft"><b>Assinatura digital registada</b> em '+ob.signed+'. Documento de adesão arquivado no seu dossier com carimbo temporal e hash de integridade.</div>':
  checks.map((c,i)=>'<div style="display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line2)"><input type="checkbox" style="width:16px;height:16px;margin-top:2px" '+(ob.checks[i]?'checked':'')+' onchange="w().onboard.checks['+i+']=this.checked;render()"><span style="font-size:12.6px;flex:1">'+c+' — <a style="color:var(--pri);cursor:pointer" onclick="openDoc(\''+(i===0?'reginterno':i===1?'etica':'termos')+'\')">ler documento</a></span></div>').join('')+
  '<div class="sig" style="margin-top:12px"><label class="f" style="margin-top:0">Assinatura digital — escreva o seu nome completo</label><input id="sigName" placeholder="'+e.nome+'">'+
  '<button class="btn" style="margin-top:10px" onclick="signOnboard()">Assinar e aceitar</button><div class="mini" style="margin-top:6px">A assinatura vale como declaração de conhecimento das normas (art.º 23.º do Regulamento Interno) e consentimento nos termos da Lei n.º 22/11.</div></div>')+'</div></div>';
 }
 if(T==='percurso'){
  const isNz=S.co==='nz'&&e.id===1;
  const items=isNz?[

 wf.comTxt=(dec==='manter'?'nota mantida':'nota ajustada')+' — '+t;wf.stage=4;
 audit('Decisão da Comissão de Avaliação: '+wf.comTxt+' (nota final '+wf.finalScore+')');

function repData(){
 const wf=w().flow;
 const rows=Object.keys(co().dirs).map(dk=>{
  const dEmps=emps().filter(e=>e.dept===dk);
  const m25=avgArr(dEmps.map(e=>e.s[2]));
  const list26=dEmps.map(e=>{
    if(e.id===colEmp().id) return (wf.stage>=4)?wf.finalScore:null;
    if(e.flag&&e.flag.indexOf('disciplinar')>-1) return null;
    return f26(e);
  });
  return [dk, co().dirs[dk], dEmps.length, m25, avgArr(list26)];
 });
 const g25=avgArr(emps().map(e=>e.s[2]));
 const g26=avgArr(rows.map(r=>r[4]).filter(x=>x!=null));
 const v25=emps().map(e=>e.s[2]).filter(x=>x!=null);
 const dist=[['Excelente (≥4,5)',v25.filter(x=>x>=4.5).length],['Muito Bom (4,0–4,4)',v25.filter(x=>x>=4&&x<4.5).length],['Bom (3,0–3,9)',v25.filter(x=>x>=3&&x<4).length],['Suficiente (2,5–2,9)',v25.filter(x=>x>=2.5&&x<3).length],['Insuficiente (<2,5)',v25.filter(x=>x<2.5).length]];
 const sorted=rows.filter(r=>r[3]!=null).slice().sort((a,b)=>b[3]-a[3]);
 const best=sorted[0], worst=sorted[sorted.length-1];
 const lows=emps().filter(e=>e.s[2]!=null&&e.s[2]<3);
 const tops=emps().filter(e=>e.s[2]!=null&&e.s[2]>=4.3&&e.pot===3);
 const needF=emps().filter(e=>e.s[2]!=null&&e.s[2]<3.5);
 const dimFraca=co().cult.dims.slice().sort((a,b)=>a[3]-b[3])[0];
 const dimForte=co().cult.dims.slice().sort((a,b)=>b[3]-a[3])[0];
 return {rows,g25,g26,dist,best,worst,lows,tops,needF,dimFraca,dimForte,nAval:v25.length,wf};
}

function addAnnex(tipo){
 const w_=w();
 if(tipo==='nota'){
  const n=prompt('Escreva a nota a anexar ao relatório:');
  if(!n||n.trim().length<3)return;
  w_.repAnnex.push({ic:'✎',nome:'Nota do Capital Humano',tipo:'nota',nota:n.trim(),ts:nowts()});
  audit('Nota anexada ao relatório consolidado');
 } else if(tipo==='img'){
  w_.repAnnex.push({ic:'▣',nome:'Gráfico da distribuição de níveis (imagem)',tipo:'imagem PNG',nota:null,ts:nowts()});
  audit('Imagem anexada ao relatório consolidado');
 } else {
  w_.repAnnex.push({ic:'▤',nome:'Documento de suporte (PDF)',tipo:'documento PDF',nota:null,ts:nowts()});
  audit('Documento anexado ao relatório consolidado');
 }
 notify('CE','Novo anexo adicionado ao Relatório Consolidado do Ciclo pelo Capital Humano.');
 render();
}

const estadoTag=e=>({pendente_dir:['warn','aguarda director'],pendente_ch:['info','aguarda Capital Humano'],aprovada:['ok','aprovada'],autorizada:['ok','autorizada'],recusada:['bad','recusada'],justificada:['ok','justificada'],gozada:['pri','gozada']}[e]||['info',e]);
const tipoLabel=t=>({ferias:'Férias',falta:'Falta justificada',maternidade:'Licença de maternidade',paternidade:'Licença de paternidade'}[t]||t);

/* ---- saldo de férias (22 dias úteis/ano, art. 201.º LGT) ---- */
function saldoFerias(cok,empId){
 const gozados=w().absReq.filter(r=>r.empId===empId&&r.tipo==='ferias'&&(r.estado==='aprovada'||r.estado==='gozada')).reduce((s,r)=>s+r.dias,0);
 const marcados=w().absReq.filter(r=>r.empId===empId&&r.tipo==='ferias'&&(r.estado==='pendente_dir'||r.estado==='pendente_ch')).reduce((s,r)=>s+r.dias,0);
 return {total:22, gozados, marcados, disp:22-gozados-marcados};
}

function ausencias(){
 const R=S.role;
 if(R==='COL') return absCol();
 if(R==='DIR') return absDir();
 return absCH(); // CH, CE
}

/* ---------- COLABORADOR: pedir férias, justificar faltas, ver saldo ---------- */
function absCol(){
 const e=colEmp(); const sal=saldoFerias(S.co,e.id);
 const meus=w().absReq.filter(r=>r.empId===e.id).sort((a,b)=>b.id-a.id);
 return head('O seu tempo · '+co().curto,'Férias & Ausências',
  'Peça férias, justifique faltas e acompanhe as aprovações — sem papel, sem idas ao Capital Humano. Tudo conforme a Lei Geral do Trabalho.')+
 '<div class="grid g4">'+
  '<div class="card kpi"><div class="v">'+sal.total+'</div><div class="l">Dias de férias/ano (art. 201.º)</div></div>'+
  '<div class="card kpi"><div class="v">'+sal.gozados+'</div><div class="l">Já gozados / aprovados</div></div>'+
  '<div class="card kpi"><div class="v">'+sal.marcados+'</div><div class="l">Marcados (a aguardar)</div></div>'+
  '<div class="card kpi"><div class="v" style="color:var(--pri)">'+sal.disp+'</div><div class="l">Disponíveis</div></div>'+
 '</div>'+
 '<div class="grid g2" style="margin-top:13px">'+
  /* pedir férias */
  '<div class="card"><h3>Solicitar férias</h3>'+
   '<div class="notice"><b>Regra LGT:</b> o gozo faz-se de acordo com o mapa anual; carece de autorização da chefia e comunicação ao Capital Humano. A empresa não pode impedir o gozo do direito (art. 214.º).</div>'+
   '<div class="grid g2"><div><label class="f">Data de início</label><input type="date" id="fIni" value="2026-08-18"></div>'+
   '<div><label class="f">Data de fim</label><input type="date" id="fFim" value="2026-09-05"></div></div>'+
   '<label class="f">Observações (opcional)</label><input id="fObs" placeholder="Ex.: período principal de férias">'+
   '<button class="btn" style="margin-top:12px" onclick="reqFerias()">Submeter pedido ao director</button>'+
  '</div>'+
  /* justificar falta */
  '<div class="card"><h3>Justificar uma falta</h3>'+
   '<label class="f">Motivo (art. 150.º LGT)</label><select id="jTipo">'+FALTA_TIPOS.map(t=>'<option value="'+t[0]+'">'+t[1]+' — '+t[2]+'</option>').join('')+'</select>'+
   '<div class="grid g2"><div><label class="f">De</label><input type="date" id="jIni"></div><div><label class="f">Até</label><input type="date" id="jFim"></div></div>'+
   '<label class="f">Documento de suporte (atestado, certidão…)</label>'+
   '<div id="jDocBox" class="doc" style="cursor:pointer" onclick="fakeUpload()"><div class="dic">＋</div><div class="dn"><b id="jDocName">Anexar documento</b><span>PDF ou imagem — atestado médico, certidão, convocatória</span></div></div>'+
   '<button class="btn" style="margin-top:10px" onclick="justificarFalta()">Submeter justificação</button>'+
  '</div>'+
 '</div>'+
 /* histórico do colaborador */
 '<div class="card" style="margin-top:13px"><h3>Os meus pedidos e ausências</h3>'+absTable(meus,false)+'</div>';
}

let _uploaded=null;
function fakeUpload(){ _uploaded='Atestado médico — '+today(); document.getElementById('jDocName').textContent='✓ '+_uploaded; document.getElementById('jDocBox').style.borderColor='var(--ok)'; }

function reqFerias(){
 const ini=$('fIni').value, fim=$('fFim').value;
 if(!ini||!fim||fim<ini) return alert('Verifique as datas do pedido.');
 const dias=diasUteis(ini,fim); const e=colEmp(); const sal=saldoFerias(S.co,e.id);
 if(dias>sal.disp) return alert('Só tem '+sal.disp+' dias disponíveis; está a pedir '+dias+'.');
 const r={id:++w().absId, empId:e.id, tipo:'ferias', ini, fim, dias, motivo:$('fObs').value.trim()||'Gozo de férias.', estado:'pendente_dir', doc:null, ts:nowts(), hist:['Pedido submetido pelo colaborador — aguarda autorização do director.']};
 w().absReq.push(r);
 audit('Pedido de férias submetido ('+dias+' dias úteis: '+fmtD(ini)+'–'+fmtD(fim)+')');
 notify('DIR',e.nome+' solicitou '+dias+' dias de férias ('+fmtD(ini)+'–'+fmtD(fim)+') — aguarda a sua autorização.');
 renderNav();render();
 alert('Pedido de férias submetido ✓\n\nO seu director foi notificado para autorizar. Mude para o perfil "Director" para ver o pedido a chegar.');
}
function justificarFalta(){
 const tipo=$('jTipo').value, ini=$('jIni').value, fim=$('jFim').value||ini;
 if(!ini) return alert('Indique a data da falta.');
 const dias=diasUteis(ini,fim); const e=colEmp();
 const tl=FALTA_TIPOS.find(t=>t[0]===tipo);
 const r={id:++w().absId, empId:e.id, tipo:'falta', subtipo:tipo, ini, fim, dias, motivo:tl[1]+' ('+tl[2]+')', estado:'justificada', doc:_uploaded, ts:nowts(), hist:['Falta comunicada e justificada pelo colaborador'+(_uploaded?' com documento anexado.':' (sem documento).'),'Registada como falta justificada — art. 150.º LGT.']};
 w().absReq.push(r);
 audit('Falta justificada submetida — '+tl[1]+' ('+fmtD(ini)+(fim!==ini?'–'+fmtD(fim):'')+')');
 notify('CH',e.nome+' justificou uma falta ('+tl[1]+')'+(_uploaded?' com documento de suporte.':'.'));
 _uploaded=null; renderNav();render();
 alert('Falta justificada ✓\n\nO Capital Humano foi notificado. A justificação e o documento ficam registados no seu portal.');
}

/* ---------- DIRECTOR: autorizar pedidos da equipa ---------- */
function absDir(){
 const dd=dirEmp().dept;
 const equipa=emps().filter(e=>e.dept===dd);
 const ids=equipa.map(e=>e.id);
 const pend=w().absReq.filter(r=>r.estado==='pendente_dir'&&ids.includes(r.empId));
 const outros=w().absReq.filter(r=>ids.includes(r.empId)&&r.estado!=='pendente_dir').sort((a,b)=>b.id-a.id);
 return head('A sua equipa · '+CO[S.co].dirs[dd],'Férias & Ausências — autorizações',
  'Autoriza aqui os pedidos de férias da sua equipa. A decisão notifica o colaborador e o Capital Humano, e alimenta o mapa de férias.')+
 '<div class="card"><h3>Pedidos a aguardar a sua autorização'+(pend.length?' ('+pend.length+')':'')+'</h3>'+
  (pend.length?pend.map(r=>{const e=absEmp(S.co,r.empId);const sal=saldoFerias(S.co,r.empId);return '<div class="doc" style="align-items:flex-start"><div class="dic">'+(r.tipo==='ferias'?'☼':'!')+'</div><div class="dn" style="flex:1"><b>'+e.nome+' — '+tipoLabel(r.tipo)+'</b><span>'+fmtD(r.ini)+' a '+fmtD(r.fim)+' · '+r.dias+' dias úteis · saldo disponível: '+sal.disp+' dias</span><div class="mini" style="margin-top:4px">'+r.motivo+'</div></div><div style="display:flex;gap:6px;flex-shrink:0"><button class="btn" onclick="dirDecideAbs('+r.id+',true)">Autorizar</button><button class="btn ghost" onclick="dirDecideAbs('+r.id+',false)">Recusar</button></div></div>';}).join(''):'<div class="mini">Sem pedidos pendentes. Quando um colaborador seu pedir férias, aparece aqui com uma notificação.</div>')+
 '</div>'+
 '<div class="card" style="margin-top:13px"><h3>Histórico da equipa</h3>'+absTable(outros,true)+'</div>';
}
function dirDecideAbs(id,ok){
 const r=w().absReq.find(x=>x.id===id); if(!r)return;
 const e=absEmp(S.co,r.empId);
 if(ok){ r.estado='pendente_ch'; r.hist.push('Autorizado pela direcção ('+nowts()+') — comunicado ao Capital Humano.');
  audit('Pedido de férias de '+e.nome+' autorizado pela direcção');
  notify('CH','Férias de '+e.nome+' autorizadas pela direcção — para averbamento no mapa.');
  notify('COL','O seu director autorizou as suas férias ('+fmtD(r.ini)+'–'+fmtD(r.fim)+'). Segue para o Capital Humano.');
  alert('Pedido autorizado ✓\n\nO Capital Humano foi notificado para averbar no mapa de férias.');
 } else { r.estado='recusada'; r.hist.push('Não autorizado pela direcção ('+nowts()+').');
  audit('Pedido de férias de '+e.nome+' recusado pela direcção');
  notify('COL','O seu director não autorizou o pedido de férias ('+fmtD(r.ini)+'–'+fmtD(r.fim)+'). Contacte a sua chefia.');
  alert('Pedido recusado. O colaborador foi notificado.');
 }
 renderNav();render();
}

/* ---------- CAPITAL HUMANO / CE: mapa anual + averbamento + maternidade ---------- */
function absCH(){
 const isCE=S.role==='CE';
 const rq=w().absReq;
 const pendCH=rq.filter(r=>r.estado==='pendente_ch');
 const mat=rq.filter(r=>r.tipo==='maternidade');
 const totFer=rq.filter(r=>r.tipo==='ferias').length;
 return head(isCE?'Visão de gestão':'Gestão de assiduidade · '+co().curto,'Férias & Ausências'+(isCE?'':' — Capital Humano'),
  'O mapa de férias, os averbamentos, as faltas justificadas e as licenças de maternidade — geridos num só lugar, conforme a Lei Geral do Trabalho.')+
 '<div class="grid g4">'+
  '<div class="card kpi click" onclick="scrollMap()"><div class="v">'+(w().mapDone?'✓':'—')+'</div><div class="l">Mapa de férias '+new Date().getFullYear()+'</div></div>'+
  '<div class="card kpi"><div class="v">'+pendCH.length+'</div><div class="l">A averbar (autorizados)</div></div>'+
  '<div class="card kpi"><div class="v">'+rq.filter(r=>r.tipo==='falta').length+'</div><div class="l">Faltas justificadas</div></div>'+
  '<div class="card kpi"><div class="v">'+mat.length+'</div><div class="l">Licenças de maternidade</div></div>'+
 '</div>'+
 (!isCE?
 '<div class="grid g2" style="margin-top:13px">'+
  '<div class="card"><h3>Início do exercício — mapa de férias</h3>'+
   (w().mapDone?'<div class="notice soft"><b>Mapa de '+new Date().getFullYear()+' elaborado.</b> Os pedidos dos colaboradores são confrontados com o mapa e averbados à medida que são autorizados.</div>':'<div class="notice"><b>Obrigação legal (art. 209.º LGT):</b> a empresa elabora anualmente o mapa de férias. Gere aqui a base do mapa para todo o efectivo.</div>'+'<button class="btn" onclick="chBuildMap()">Elaborar mapa de férias '+new Date().getFullYear()+'</button>')+
  '</div>'+
  '<div class="card"><h3>Registar licença de maternidade</h3>'+
   '<div class="notice"><b>Art. 253.º LGT:</b> licença de 3 meses (90 dias), remunerada; pode iniciar 4 semanas antes do parto; +4 semanas em parto múltiplo. Licença complementar opcional de 4 semanas.</div>'+
   '<label class="f">Colaboradora</label><select id="matEmp">'+emps().filter(e=>isFem(e.nome)).map(e=>'<option value="'+e.id+'">'+e.nome+'</option>').join('')+'</select>'+
   '<div class="grid g2"><div><label class="f">Início da licença</label><input type="date" id="matIni" value="2026-07-01"></div><div><label class="f">Parto múltiplo?</label><select id="matMult"><option value="0">Não — 90 dias</option><option value="1">Sim — 90 + 28 dias</option></select></div></div>'+
   '<button class="btn" style="margin-top:10px" onclick="chMaternidade()">Registar licença</button>'+
  '</div>'+
 '</div>':'')+
 /* averbamentos pendentes */
 (pendCH.length?'<div class="card" style="margin-top:13px"><h3>Averbar no mapa (férias autorizadas pela direcção)</h3>'+
  pendCH.map(r=>{const e=absEmp(S.co,r.empId);return '<div class="doc"><div class="dic">☼</div><div class="dn"><b>'+e.nome+'</b><span>'+fmtD(r.ini)+'–'+fmtD(r.fim)+' · '+r.dias+' dias · autorizado pela direcção</span></div>'+(isCE?'<span class="tag info">aguarda CH</span>':'<button class="btn" onclick="chAverbar('+r.id+')">Averbar no mapa</button>')+'</div>';}).join('')+'</div>':'')+
 /* mapa consolidado */
 '<div class="card" id="mapCard" style="margin-top:13px"><h3>Mapa de férias & ausências — '+co().curto+'</h3>'+absTable(rq.slice().sort((a,b)=>b.id-a.id),true)+'</div>';
}
function chBuildMap(){ w().mapDone=true; audit('Mapa de férias '+new Date().getFullYear()+' elaborado pelo Capital Humano'); notify('CE','Mapa de férias '+new Date().getFullYear()+' elaborado — disponível para consulta.'); render(); alert('Mapa de férias elaborado ✓\n\nA partir de agora, os pedidos autorizados são averbados no mapa.'); }
function chAverbar(id){ const r=w().absReq.find(x=>x.id===id); if(!r)return; const e=absEmp(S.co,r.empId); r.estado='aprovada'; r.hist.push('Averbado no mapa de férias pelo Capital Humano ('+nowts()+').'); audit('Férias de '+e.nome+' averbadas no mapa'); notify('COL','As suas férias foram averbadas no mapa pelo Capital Humano — está tudo confirmado. Bom descanso!'); notify('DIR','Férias de '+e.nome+' averbadas no mapa.'); render(); alert('Férias averbadas no mapa ✓\n\nO colaborador e o director foram notificados. O ciclo do pedido está completo.'); }
function chMaternidade(){
 const id=+$('matEmp').value, ini=$('matIni').value, mult=$('matMult').value==='1';
 const e=absEmp(S.co,id); const dias=mult?118:90;
 const d=new Date(ini); const fim=new Date(d.getTime()+dias*86400000).toISOString().slice(0,10);
 w().absReq.push({id:++w().absId, empId:id, tipo:'maternidade', ini, fim, dias, motivo:'Licença de maternidade — '+(mult?'parto múltiplo (90+28 dias)':'90 dias')+' (art. 253.º LGT), remunerada.', estado:'aprovada', doc:'Atestado médico', ts:nowts(), hist:['Registada pelo Capital Humano.','Ciclo de avaliação ajustado proporcionalmente ao período de licença.']});
 audit('Licença de maternidade registada — '+e.nome+' ('+dias+' dias)');
 notify('COL','A sua licença de maternidade foi registada ('+dias+' dias, remunerada). Bom descanso.');
 notify('DIR','Licença de maternidade de '+e.nome+' registada — '+dias+' dias. Planeie a substituição.');
 render(); alert('Licença de maternidade registada ✓ ('+dias+' dias)\n\nA colaboradora e a direcção foram notificadas; o ciclo de avaliação é ajustado automaticamente.');
}
function scrollMap(){ const c=document.getElementById('mapCard'); if(c)c.scrollIntoView({behavior:'smooth'}); }

/* ---- tabela de ausências reutilizável ---- */
function absTable(list,showName){
 if(!list.length) return '<div class="mini">Sem registos.</div>';
 return '<table><tr>'+(showName?'<th>Colaborador</th>':'')+'<th>Tipo</th><th>Período</th><th>Dias</th><th>Documento</th><th>Estado</th><th></th></tr>'+
  list.map(r=>{const e=absEmp(S.co,r.empId);const et=estadoTag(r.estado);return '<tr>'+(showName?'<td><b>'+(e?e.nome:'—')+'</b></td>':'')+
   '<td>'+tipoLabel(r.tipo)+'</td><td>'+fmtD(r.ini)+(r.fim!==r.ini?'–'+fmtD(r.fim):'')+'</td><td>'+r.dias+'</td>'+
   '<td>'+(r.doc?'<span class="tag ok">anexado</span>':'<span class="mini">—</span>')+'</td>'+
   '<td><span class="tag '+et[0]+'">'+et[1]+'</span></td>'+
   '<td style="text-align:right"><a style="color:var(--pri);cursor:pointer;font-size:11px" onclick="absDetail('+r.id+')">detalhe</a></td></tr>';}).join('')+'</table>';
}
function absDetail(id){
 const r=w().absReq.find(x=>x.id===id); if(!r)return; const e=absEmp(S.co,r.empId);
 alert('AUSÊNCIA · '+tipoLabel(r.tipo).toUpperCase()+'\n'+e.nome+'\n\nPeríodo: '+fmtD(r.ini)+' a '+fmtD(r.fim)+' ('+r.dias+' dias úteis)\nMotivo: '+r.motivo+(r.doc?'\nDocumento: '+r.doc:'')+'\n\nTramitação:\n• '+r.hist.join('\n• '));
}

/* ---- utilitários de data ---- */
function fmtD(s){ if(!s)return '—'; const p=s.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }
function diasUteis(ini,fim){ let d=new Date(ini),e=new Date(fim),n=0; while(d<=e){const w=d.getDay(); if(w!==0&&w!==6)n++; d=new Date(d.getTime()+86400000);} return n; }


/* ================= ROUTER ================= */
function render(){
 const R={inicio,portal,colabs,aval,disc,ausencias,formacao,cultura,relatorios,hist,notifs,admin};
 $('main').innerHTML='<div class="mod">'+(R[S.mod]||inicio)()+'</div>';
}
renderNav();render();
</script>
